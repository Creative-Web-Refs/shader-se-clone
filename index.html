<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Shader Development Studio 网站镜像的静态回退页面。"
    />
    <title>Shader.se 镜像</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Georgia, "Times New Roman", serif;
        background: #090909;
        color: #f2eee3;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(42rem, calc(100% - 3rem));
        line-height: 1.5;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(3rem, 9vw, 7rem);
        font-weight: 400;
        line-height: 0.9;
      }

      a {
        color: inherit;
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shader.se<br />镜像</h1>
      <p>
        当前静态预览没有运行 Cloudflare Pages 镜像 Worker。请访问
        <a href="https://www.shader.se/">原始网站</a>。
      </p>
      <p>
        本项目是用于归档与技术研究的独立镜像。原始内容的全部权利仍归
        Shader Sweden AB 及相应权利人所有。
      </p>
    </main>
  </body>
</html>
